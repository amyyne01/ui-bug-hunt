name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: skills/ui-bug-hunt/scripts
      - run: npx playwright install --with-deps chromium
        working-directory: skills/ui-bug-hunt/scripts
      - run: node test/selftest.mjs --channel chromium
